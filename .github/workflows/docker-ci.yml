name: "Docker CI"
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  docker-ci:
    name: Docker CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
      - name: Launch all services with default configuration
        # Deliberately under the job's 10m cap. A stuck dependency then fails
        # this step with compose's own "dependency failed to start: container
        # lago-api is unhealthy", which names the culprit, instead of tripping
        # the job timeout — which kills the run before the log dump below gets
        # to say anything at all.
        env:
          LAGO_CREATE_ORG: "true"
          LAGO_ORG_NAME: "Lago"
          LAGO_ORG_USER_EMAIL: "foo@bar.com"
          LAGO_ORG_USER_PASSWORD: "foobar"
          LAGO_ORG_API_KEY: "test"
        run: |
          export LAGO_RSA_PRIVATE_KEY="`openssl genrsa 2048 | openssl base64 -A`"
          docker compose up -d --wait --wait-timeout 420
      - name: cURL API
        run: curl -f http://localhost:3000/health
      - name: cURL Front
        run: curl -f http://localhost:80
      - name: cURL API Customers
        run: |
          curl -f http://localhost:3000/api/v1/customers -H "Authorization: Bearer test"
      - name: Dump service logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100

      - name: Down services
        if: always()
        run: docker compose down -v
