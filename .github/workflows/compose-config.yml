name: "Compose config"
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'deploy/**'
  workflow_dispatch:
jobs:
  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy/
      # Every compose file must stop without the secrets and render with them
      - name: Check the compose files
        run: |
          files="docker-compose.yml deploy/docker-compose.local.yml deploy/docker-compose.light.yml deploy/docker-compose.production.yml"
          for f in $files; do
            if docker compose -f "$f" --env-file /dev/null config -q 2>/dev/null; then
              echo "::error file=$f::renders without the secrets"
              exit 1
            fi
          done
          {
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "LAGO_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 32)"
            echo "LAGO_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 32)"
            echo "LAGO_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 32)"
          } > ci.env
          for f in $files; do
            docker compose -f "$f" --env-file ci.env config -q
          done
