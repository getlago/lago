# Local-development values for the LagoUsage property group.
#
# On Amazon Managed Service for Apache Flink these SAME KEYS are supplied as
# an application PropertyGroup named "LagoUsage" (see
# conf/msf-property-groups.example.json) and this file is ignored. Keep the
# two in sync: a key that exists only here is a key that will be missing in
# production.
#
# Override the file entirely with LAGO_FLINK_CONFIG=/path/to/other.properties.

pipeline.job-name        = lago-usage
# Comma-separated classpath SQL resources, executed in order.
pipeline.stages          = /sql/00_source_events_raw.sql,/sql/01_cdc_dimensions.sql,/sql/02_stage0_enrichment.sql
# Print the planner's execution plan and exit without submitting anything.
# Override per-run: flink run ... (this file) or LAGO_FLINK_CONFIG.
pipeline.explain         = false
# Flink's equivalent of the RisingWave design's 32-day bounded working set.
pipeline.state-ttl-days  = 32
pipeline.mini-batch.enabled = false
# Stage-0 sink: `blackhole` to measure the pipeline's own cost, `print` to read
# the rows in the TaskManager log. Override per run:
#   ./scripts/submit.sh --stage0.sink.connector print
stage0.sink.connector    = blackhole

# --- Kafka / Redpanda -------------------------------------------------------
# Local: the lago dev Redpanda, reachable by service name on lago_dev_default.
# AWS:   the MSK bootstrap string, plus SASL/TLS properties in the PropertyGroup.
kafka.bootstrap.servers  = redpanda:9092
kafka.topic.events-raw   = events-raw
kafka.group.id           = lago_flink_usage
# 'latest-offset' mirrors the RisingWave source's scan.startup.mode='latest'
# (shadow pipeline consumes new events only). Use 'earliest-offset' to replay.
kafka.startup.mode       = latest-offset

# --- Postgres CDC (dimensions) ---------------------------------------------
# Gate 1: live dimension replication.
postgres.hostname        = db
postgres.port            = 5432
postgres.database        = lago
postgres.schema          = public
postgres.username        = lago
postgres.password        = changeme
# Flink CDC needs ONE SLOT PER TABLE (unlike RisingWave's single shared
# source) — this is a PREFIX; each table appends its own name. See
# sql/01_cdc_dimensions.sql.
postgres.slot.name       = lago_flink
# Reuses the table set RisingWave already published. A publication is just a
# set of tables; the per-consumer state is the slot, so two engines sharing a
# publication do not interfere.
postgres.publication     = rw_publication
# Debezium `topic.prefix` for the one-slot dimension path (sql/01b_*).
cdc.topic.prefix         = lagodim

# --- ClickHouse -------------------------------------------------------------
clickhouse.url           = http://clickhouse:8123
clickhouse.database      = default
