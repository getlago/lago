[package]
name = "lago-rw-udf-slim-filters"
version = "0.1.0"
edition = "2021"
publish = false

# Unit tests for the slim-filters UDF bodies (src/*.rs), including a parity
# suite against the production matching_filter (../../udf/src). The same
# source files are assembled verbatim into ../sql/01_functions.sql by
# ./gen_sql.sh and compiled by RisingWave's embedded Rust UDF toolchain, which
# only allows std / chrono / rust_decimal / serde_json.

[dependencies]
serde_json = "1"

[dev-dependencies]
