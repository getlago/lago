# TLS with a Let's Encrypt certificate. Mount this file over
# /etc/nginx/conf.d/default.conf (see the `front` service in
# docker-compose.yml) and replace lago.example with your domain.
#
# The front image runs nginx as uid 65532, which cannot bind ports below 1024.
# The listeners are 8080 (HTTP) and 8443 (HTTPS); docker-compose.yml publishes
# them on the host as 80 and 443. The certificates must be readable by uid
# 65532: extra/init-letsencrypt.sh and the certbot service set the owner with a
# deploy hook.
#
# This file replaces the image's own server block, so it repeats what that
# block does: it serves env-config.js (the runtime config that .env.sh writes
# to /tmp at start) and includes the rendered security headers
# (/tmp/csp.conf).
#
# There is no `ssl_dhparam`: the image's OpenSSL cannot load DH parameter
# files, and nginx then offers ECDHE key exchange only, which every current
# client supports.

server {
  listen 8080;
  listen [::]:8080;
  server_name lago.example;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  server_name lago.example;

  ssl_certificate /etc/letsencrypt/live/lago.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lago.example/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /usr/share/nginx/html;

  # .env.sh sits in the doc root. Never serve dotfiles (as the image's own
  # default.conf).
  location ~ /\. {
    return 404;
  }

  location ~ ^/(.*/)?env-config\.js$ {
    include /tmp/csp.conf;
    add_header Cache-Control "no-cache";
    alias /tmp/env-config.js;
  }

  location /assets/ {
    include /tmp/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /tmp/csp.conf;
    add_header Cache-Control "no-cache";
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }
}
