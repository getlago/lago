# Embedded Valkey (Redis protocol) of the all-in-one image. Only lago-api,
# Sidekiq and clockwork connect to it, over loopback. runner.sh adds
# --dir, --daemonize, --pidfile and --logfile on the command line, so the AOF
# and the log land on the volume.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Sidekiq jobs live here: keep them across restarts.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
