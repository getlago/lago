# Top-level nginx config of the all-in-one image. nginx runs as nonroot
# (uid 65532), so everything it writes goes to /tmp: the pid file and the
# temp paths. The compiled defaults under /var/lib/nginx are root-owned.

worker_processes auto;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The Debian image logged requests to a file in the container; stdout would
  # bury the API and worker logs that foreman prints.
  access_log off;

  sendfile          on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  server {
    # Port 80 as nonroot: Docker sets net.ipv4.ip_unprivileged_port_start=0
    # in every container by default.
    listen 80;
    listen [::]:80;

    root /app/front;

    # Do not disclose the nginx version in the Server header or on error pages.
    server_tokens off;

    # Hashed assets: cache forever (the file name changes on each build).
    location /assets/ {
      include /tmp/csp.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      # Rendered by the front's .env.sh at start, from
      # /etc/nginx/csp.conf.template (LAGO_FRAME_ANCESTORS).
      include /tmp/csp.conf;
      add_header Cache-Control "no-cache";
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;
    }

    include /etc/nginx/extra-conf.d/*.conf;
  }
}
